name: Build Windows installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: "1.0.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (self-contained, no .NET install needed)
        run: >
          dotnet publish ShumaDesktop/ShumaDesktop.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.APP_VERSION }} -o publish

      - name: Render a sample report (layout check)
        shell: pwsh
        run: |
          Start-Process -FilePath publish\ShumaDesktop.exe -ArgumentList "--sample","sample-report.pdf" -Wait -NoNewWindow
          if (-not (Test-Path sample-report.pdf)) { Write-Error "sample PDF was not created"; exit 1 }

      - name: Publish the sample PDF to the preview branch
        shell: pwsh
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git fetch origin shuma-desktop-preview 2>$null
          git switch --orphan preview-tmp
          git rm -rq --cached . 2>$null
          git add -f sample-report.pdf
          git commit -m "sample report ${{ github.sha }}"
          git push -f origin HEAD:shuma-desktop-preview
          git switch -f ${{ github.ref_name }}

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer\ShumaDesktop.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ShumaDesktop-Setup
          path: output/ShumaDesktop-Setup.exe

      - name: Publish the installer as a public download (no GitHub login needed)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete shuma-desktop-latest --cleanup-tag -y 2>$null
          gh release create shuma-desktop-latest output/ShumaDesktop-Setup.exe --target ${{ github.sha }} --title "ShumaDesktop ${{ env.APP_VERSION }}" --notes "Windows installer" --latest
