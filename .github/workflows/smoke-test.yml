name: Smoke test on emulator

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check vehicle registry API (data.gov.il)
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Linux; Android 11; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/120.0 Mobile Safari/537.36"
          BASE="https://data.gov.il/api/3/action/datastore_search?resource_id=053cea08-09bc-40ec-8f7a-156f0677aff3"
          ONE=$(curl -sS -A "$UA" "$BASE&limit=1")
          echo "$ONE" | python3 -c 'import json,sys; j=json.load(sys.stdin); print("success:", j["success"]); print("fields:", [f["id"] for f in j["result"]["fields"]])'
          PLATE=$(echo "$ONE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["records"][0]["mispar_rechev"])')
          F=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote("{\"mispar_rechev\":\"'"$PLATE"'\"}"))')
          echo "lookup by string filter for a real plate:"
          curl -sS -A "$UA" "$BASE&limit=1&filters=$F" | python3 -c 'import json,sys; j=json.load(sys.stdin); r=j["result"]["records"]; print("found:", len(r)); r and print({k:r[0].get(k) for k in ["mispar_rechev","tozeret_nm","kinuy_mishari","degem_nm","shnat_yitzur","tzeva_rechev","misgeret","sug_delek_nm","ramat_gimur","baalut","mivchan_acharon_dt","tokef_dt","moed_aliya_lakvish"]})'
          echo "plain Java-like user agent:"
          curl -sS -o /dev/null -w "%{http_code}\n" -A "Dalvik/2.1.0" "$BASE&limit=1&filters=$F"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk && echo "INSTALL_OK"
            adb logcat -c
            adb shell am start -W -n il.shamai.field/.MainActivity
            sleep 25
            echo "PID: $(adb shell pidof il.shamai.field || echo NOT_RUNNING)"
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
            echo "===== crashes ====="
            adb logcat -d -b crash || true
            echo "===== app / webview log ====="
            adb logcat -d | grep -E "AndroidRuntime|FATAL|chromium|Console|il\.shamai\.field|WebView" | tail -150 || true
            adb exec-out screencap -p > screen.png || true
            adb shell am force-stop il.shamai.field
            adb logcat -c
            adb shell am start -W -n il.shamai.field/.MainActivity --es selftest pdf
            sleep 45
            echo "===== PDF self-test ====="
            adb logcat -d | grep -E "SELFTEST|FieldCase|Uncaught|AndroidRuntime" | tail -40 || true
            adb exec-out run-as il.shamai.field cat cache/share/selftest-quote.pdf > quote.pdf || true
            adb exec-out run-as il.shamai.field cat cache/share/selftest-report.pdf > report.pdf || true
            ls -la quote.pdf report.pdf || true

      - name: Inspect PDFs
        if: always()
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          for f in quote.pdf report.pdf; do
            echo "===== $f"; [ -s "$f" ] || { echo "MISSING"; continue; }
            pdfinfo "$f" | grep -E "Pages|Page size"
            pdftotext -layout "$f" - | head -50
          done
          [ -s quote.pdf ] && pdftoppm -r 45 -png quote.pdf q || true
          [ -s report.pdf ] && pdftoppm -r 45 -png report.pdf r || true
          for f in $(ls q-*.png 2>/dev/null | head -2) $(ls r-*.png 2>/dev/null | head -4); do
            echo "IMG_BEGIN $f"; base64 -w 3000 "$f"; echo "IMG_END $f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: |
            screen.png
            quote.pdf
            report.pdf
          if-no-files-found: ignore
