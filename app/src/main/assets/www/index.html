<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שומת נזקים</title>
<style>
/* Layout idea: phone-first form app. List of appraisals → one appraisal in the order of the printed form → A4 preview that prints to PDF. */
:root{
  --ink:#16233d; --paper:#eef2f8; --card:#fff; --line:#c9d3e3; --muted:#5b6b85;
  --blue:#1f3b73; --accent:#2f5496; --field:#f4f7fc; --bad:#9c1c1c; --ok:#1d7a46;
  --body:system-ui,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--body)}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:19px;margin:0;flex:1}
header button{background:transparent;color:#fff;border:1px solid #ffffff66}
main{max-width:820px;margin:0 auto;padding:14px;display:grid;gap:14px}
h2{font-size:17px;margin:0;color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:grid;gap:3px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #f0b43a;outline-offset:1px}
button{font:600 15px var(--body);border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
button.small{padding:5px 9px;font-size:13px}
button:disabled{opacity:.5}
.note{font-size:13px;color:var(--muted)}
.hide{display:none!important}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:start;width:100%}
.item .t{font-weight:700}.item .s{font-size:13px;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:10px;padding:18px}
/* repair rows */
.rep{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:22px 1fr 1fr 110px 34px;gap:6px;align-items:start}
.rdel{grid-column:5;padding:6px 0}
.rrow .n{font-size:12px;color:var(--muted);padding-top:10px;text-align:center}
.rhead{font-size:12px;color:var(--muted);font-weight:700}
@media (max-width:560px){.rrow{grid-template-columns:22px 1fr 96px 34px}.rrow .part{grid-column:2/5}.rdel{grid-column:4;grid-row:1}}
.logos{display:flex;gap:16px;flex-wrap:wrap}
.logo{display:grid;gap:6px;justify-items:start}
.logo img{height:56px;max-width:160px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px}
#sig{width:100%;max-width:420px;height:150px;background:#fff;border:1px dashed var(--muted);border-radius:8px;touch-action:none}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;flex-direction:column}
.ov .bar{background:var(--blue);color:#fff;display:flex;gap:8px;padding:10px;flex-wrap:wrap;align-items:center}
.ov .bar span{flex:1;font-weight:700}
.ov iframe{flex:1;border:0;background:#888;width:100%}
.toast{position:fixed;bottom:14px;inset-inline:14px;margin:auto;max-width:460px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;z-index:30;font-size:14px}
</style>
</head>
<body>
<header><h1 id="htitle">שומת נזקים</h1><button id="hset">הגדרות</button></header>
<main id="app"></main>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<input id="fileImg" type="file" accept="image/*" class="hide">

const WORKS_L=[["bumper","שיפוץ מגן"],["reg309","תקנה 309"],["ac","עבודות מזגן"],["sensors",'פו"ה חיישנים'],["glass","עבודות זגגות"]];
const TYPES=["","מקורי","תואם","משומש"];
const MAXROWS=15;
const blankRow=()=>({work:"",part:"",type:""});

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const heDate=d=>{if(!d)return"";const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?`${m[3]}/${m[2]}/${m[1]}`:d};
function toast(m,ms=3000){const t=$("toast");t.textContent=m;t.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hide"),ms)}

/* ---------- storage ---------- */
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch{return d}};
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast("האחסון מלא. מחק שומות ישנות.");return false}}
let S=Object.assign({},DEFAULT_SETTINGS,jget("shuma.settings",{}));
let R=jget("shuma.reports",{});
for(const r of Object.values(R)){r.rows=(r.rows||[]).slice(0,MAXROWS);while(r.rows.length>1&&!(r.rows.at(-1).work||r.rows.at(-1).part||r.rows.at(-1).type))r.rows.pop();if(!r.rows.length)r.rows.push(blankRow())}
let view={name:"list",id:null};
const saveS=()=>jset("shuma.settings",S);
let saveT; function saveR(){clearTimeout(saveT);saveT=setTimeout(()=>jset("shuma.reports",R),300)}
function newReport(){
  const r={id:uid(),createdAt:Date.now(),updatedAt:Date.now(),d:{inspection_date:today()},rows:[blankRow()],w:{},signDate:today()};
  R[r.id]=r;saveR();return r;
}

/* ---------- Android bridge ---------- */
const NB={seq:0,p:new Map(),call(m,...a){return new Promise((res,rej)=>{const id="n"+(++this.seq);this.p.set(id,{res,rej});try{Native[m](id,...a)}catch{this.p.delete(id);rej({code:"bridge"})}})}};
window.__nb=(id,ok,payload)=>{const e=NB.p.get(id);if(!e)return;NB.p.delete(id);ok?e.res(payload):e.rej(payload)};
window.__toast=m=>toast(m);
window.__back=()=>{const o=document.querySelector(".ov");if(o){o.remove();return true}if(view.name!=="list"){go("list");return true}return false};
const native=!!window.Native;

/* ---------- routing ---------- */
function go(name,id=null){if(sigStop)sigStop();view={name,id};render();scrollTo(0,0)}
$("hset").onclick=()=>go(view.name==="settings"?"list":"settings");

function render(){
  $("hset").textContent=view.name==="settings"?"סגור":"הגדרות";
  if(view.name==="settings")return renderSettings();
  if(view.name==="report"&&R[view.id])return renderReport(R[view.id]);
  renderList();
}

/* ---------- list ---------- */
function renderList(){
  const list=Object.values(R).sort((a,b)=>b.updatedAt-a.updatedAt);
  $("app").innerHTML=`
  <section class="card">
    <div class="row"><h2 style="flex:1">השומות שלי</h2><button class="primary" id="new">+ שומה חדשה</button></div>
    ${list.length?list.map(r=>`<button class="item" data-id="${esc(r.id)}">
      <span class="t">${esc(r.d.license_no||"ללא מס' רישוי")} · ${esc(r.d.make_model||"")}</span><span class="s">${esc(heDate(r.d.inspection_date))}</span>
      <span class="s">${esc(r.d.ownership||"")} ${r.d.inspection_place?"· "+esc(r.d.inspection_place):""}</span><span class="s">${r.rows.filter(x=>x.work||x.part).length} שורות</span>
    </button>`).join(""):`<div class="empty"><strong>עוד אין שומות.</strong><div class="note">לחץ "שומה חדשה", מלא את הטופס והפק PDF בפורמט של טופס המשרד.</div></div>`}
  </section>
  ${!S.appraiserName?`<section class="card"><div class="note">כדאי למלא קודם בהגדרות את שם השמאי ופרטי המשרד. הם יופיעו בכל טופס.</div><div><button id="toSet">לפרטי המשרד והשמאי</button></div></section>`:""}`;
  $("new").onclick=()=>{const r=newReport();go("report",r.id)};
  if($("toSet"))$("toSet").onclick=()=>go("settings");
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>go("report",b.dataset.id));
}

/* ---------- report form ---------- */
function inp(key,label,kind,val){
  const t=kind==="date"?"date":"text", im=(kind==="num"||kind==="plate")?'inputmode="numeric"':"", dir=(kind==="ltr"||kind==="plate")?'dir="ltr"':"";
  return `<label for="d_${key}">${esc(label)}<input id="d_${key}" data-d="${key}" type="${t}" ${im} ${dir} value="${esc(val)}"></label>`;
}
function renderReport(r){
  $("app").innerHTML=`
  <div class="row"><button id="back">→ כל השומות</button></div>
  <section class="card">
    <h2>פרטי הרכב והבדיקה</h2>
    <div class="grid2">${DETAILS_R.map((f,i)=>inp(f[0],f[1],f[2],r.d[f[0]])+inp(DETAILS_L[i][0],DETAILS_L[i][1],DETAILS_L[i][2],r.d[DETAILS_L[i][0]])).join("")}</div>
    ${native?`<div class="row"><button id="plate">צלם לוחית וזהה מספר</button><button id="gps">מיקום נוכחי למקום הבדיקה</button><span id="nmsg" class="note"></span></div>`:""}
  </section>
  <section class="card">
    <h2>מהות התיקון וחלפים</h2>
    <div class="rep">
      <div class="rrow rhead"><span></span><span>מהות התיקון - עבודות</span><span class="part">פירוט חלפים</span><span>סוג</span></div>
      ${r.rows.map((x,i)=>`<div class="rrow"><span class="n">${i+1}</span>
        <input aria-label="מהות התיקון שורה ${i+1}" data-r="${i}" data-k="work" value="${esc(x.work)}">
        <input class="part" aria-label="פירוט חלפים שורה ${i+1}" data-r="${i}" data-k="part" value="${esc(x.part)}">
        <select aria-label="סוג שורה ${i+1}" data-r="${i}" data-k="type">${TYPES.map(t=>`<option ${x.type===t?"selected":""} value="${t}">${t||"—"}</option>`).join("")}</select>
        ${r.rows.length>1?`<button class="small danger rdel" data-del="${i}" aria-label="מחק שורה ${i+1}">✕</button>`:""}</div>`).join("")}
    </div>
    <div class="row">${r.rows.length<MAXROWS?`<button id="addRow">+ הוסף שורה</button>`:""}<span class="note">${r.rows.length} מתוך ${MAXROWS} שורות</span></div>
  </section>
  <section class="card">
    <h2>עבודות</h2>
    <div class="grid2">${WORKS_R.map((f,i)=>`<label for="w_${f[0]}">${f[1]}<input id="w_${f[0]}" data-w="${f[0]}" value="${esc(r.w[f[0]])}"></label><label for="w_${WORKS_L[i][0]}">${WORKS_L[i][1]}<input id="w_${WORKS_L[i][0]}" data-w="${WORKS_L[i][0]}" value="${esc(r.w[WORKS_L[i][0]])}"></label>`).join("")}</div>
  </section>
  <section class="card">
    <h2>סיום</h2>
    <label for="signDate" style="max-width:220px">תאריך בטופס<input id="signDate" type="date" value="${esc(r.signDate)}"></label>
    <div class="row">
      <button class="primary" id="pdf">${native?"הפק PDF / הדפס":"תצוגת הטופס"}</button>
      ${native?`<button id="share">שתף טופס</button>`:""}
      <button id="dup">שכפל שומה</button>
      <button class="danger" id="del">מחק</button>
    </div>
    <p class="note">${native?'ב"הפק PDF" בוחרים במסך ההדפסה "שמירה כ-PDF", או מדפסת.':"בדפדפן אפשר להדפיס או לשמור כ-PDF מתוך תצוגת הטופס."} ${S.appraiserName?"":"שם השמאי עוד לא הוגדר בהגדרות."}</p>
  </section>`;
  const touch=()=>{r.updatedAt=Date.now();saveR()};
  document.querySelectorAll("[data-d]").forEach(e=>e.oninput=()=>{r.d[e.dataset.d]=e.value;touch()});
  document.querySelectorAll("[data-w]").forEach(e=>e.oninput=()=>{r.w[e.dataset.w]=e.value;touch()});
  document.querySelectorAll("[data-r]").forEach(e=>e[e.tagName==="SELECT"?"onchange":"oninput"]=()=>{r.rows[+e.dataset.r][e.dataset.k]=e.value;touch()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{r.rows.splice(+b.dataset.del,1);touch();renderReport(r)});
  if($("addRow"))$("addRow").onclick=()=>{if(r.rows.length>=MAXROWS)return;r.rows.push(blankRow());touch();renderReport(r);const w=document.querySelectorAll('[data-k="work"]');w[w.length-1].focus()};
  $("signDate").onchange=e=>{r.signDate=e.target.value;touch()};
  $("back").onclick=()=>go("list");
  $("pdf").onclick=()=>preview(r);
  if($("share"))$("share").onclick=()=>Native.shareFile(fileName(r)+".html","text/html",reportHtml(r));
  $("dup").onclick=()=>{const c=JSON.parse(JSON.stringify(r));c.id=uid();c.createdAt=c.updatedAt=Date.now();c.d.inspection_date=today();c.signDate=today();R[c.id]=c;saveR();go("report",c.id);toast("נוצר עותק")};
  $("del").onclick=()=>confirmBox("למחוק את השומה? אי אפשר לבטל.",()=>{delete R[r.id];jset("shuma.reports",R);go("list")});
  if($("plate"))$("plate").onclick=async()=>{const m=$("nmsg");m.textContent="פותח מצלמה…";
    try{const x=await NB.call("readPlate");if(x.cancelled){m.textContent="";return}
      const d=String(x.plate||"").replace(/\D/g,"");
      if(d.length===7||d.length===8){r.d.license_no=d.length===7?`${d.slice(0,2)}-${d.slice(2,5)}-${d.slice(5)}`:`${d.slice(0,3)}-${d.slice(3,5)}-${d.slice(5)}`;$("d_license_no").value=r.d.license_no;touch();m.textContent="זוהה מספר. בדוק שהוא נכון."}
      else m.textContent="לא זוהה מספר. הקלד ידנית.";
    }catch(e){m.textContent=e&&e.code==="not_granted"?"אין הרשאת מצלמה.":"הזיהוי נכשל."}};
  if($("gps"))$("gps").onclick=async()=>{const m=$("nmsg");m.textContent="מאתר…";
    try{const l=await NB.call("getLocation");const v=l.address||`${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}`;r.d.inspection_place=v;$("d_inspection_place").value=v;touch();m.textContent=""}
    catch(e){m.textContent=({not_granted:"אין הרשאת מיקום.",location_off:"שירותי המיקום כבויים.",no_fix:"לא נמצא מיקום."})[e&&e.code]||"איתור המיקום נכשל."}};
}
const fileName=r=>`שומת נזקים ${(r.d.license_no||"").replace(/[^\d-]/g,"")} ${heDate(r.d.inspection_date).replace(/\//g,"-")}`.trim();

/* ---------- printed form (A4) ---------- */
function reportHtml(r){
  const v=k=>esc(r.d[k]), dv=k=>esc(heDate(r.d[k]));
  const val=(k,kind)=>kind==="date"?dv(k):v(k);
  const notes=String(S.notes||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const half=Math.ceil(notes.length/2);
  const contact=`<span>${esc(S.po)}</span><span>נייד: <bdi>${esc(S.mobile)}</bdi></span><span>פקס: <bdi>${esc(S.fax)}</bdi></span><span><bdi>${esc(S.email)}</bdi></span>`;
  return `<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>${esc(fileName(r))}</title><style>
@page{size:A4;margin:9mm 10mm}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Liberation Sans",sans-serif;color:#1f3b73;font-size:10.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:190mm;min-height:278mm;margin:0 auto;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:10px;border-bottom:1.5px solid #2f5496;padding-bottom:5px}
.hd .lr{height:15mm;max-width:22mm;object-fit:contain}.hd .ll{height:11mm;max-width:40mm;object-fit:contain}
.hd .tx{flex:1}.hd .t1{font-size:13pt;font-weight:700;font-style:italic;color:#2f5496}
.ct{display:flex;gap:14px;font-size:8.5pt;font-style:italic;color:#2f5496}
h1{text-align:center;font-size:17pt;margin:7px 0 0}.sub{text-align:center;font-weight:700;font-style:italic;font-size:9.5pt;color:#2f5496;margin:2px 0 8px}
table{width:100%;border-collapse:collapse;table-layout:fixed}td,th{border:.6pt solid #7f8fa9;padding:3px 5px;height:7.1mm;vertical-align:middle;color:#16233d;font-size:10pt;overflow:hidden}
th,.lb{background:#dce5f3;color:#1f3b73;font-weight:700;text-align:right}th{text-align:center}
.tb{border:1.1pt solid #7f8fa9}.num{color:#7f8fa9;font-size:7pt;width:5mm;text-align:center}
.warn{text-align:center;color:#9c1c1c;font-weight:700;font-style:italic;margin:6px 0}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;font-size:8.2pt;margin-top:7px}.notes b{grid-column:1/3}.notes ol{margin:0;padding-inline-start:16px}
.sg{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;font-weight:700}.sg .ln{display:inline-block;min-width:45mm;border-bottom:.6pt solid #7f8fa9;text-align:center;font-weight:400;color:#16233d}
.sg img{height:14mm;max-width:50mm;object-fit:contain;display:block;margin:0 auto -2px}
.ft{margin-top:auto;border-top:.8pt solid #2f5496;padding-top:3px;justify-content:center}
</style></head><body><div class="pg">
<div class="hd">${S.logoRight?`<img class="lr" src="${S.logoRight}" alt="">`:""}<div class="tx"><div class="t1">${esc(S.officeTitle)}</div><div class="ct">${contact}</div></div>${S.logoLeft?`<img class="ll" src="${S.logoLeft}" alt="">`:""}</div>
<h1>שומת נזקים</h1><div class="sub">${esc(S.subtitle)}</div>
<table class="tb"><colgroup><col style="width:15%"><col style="width:35%"><col style="width:15%"><col style="width:35%"></colgroup>
${DETAILS_R.map((f,i)=>`<tr><td class="lb">${f[1]}:</td><td>${val(f[0],f[2])}</td><td class="lb">${DETAILS_L[i][1]}:</td><td>${val(DETAILS_L[i][0],DETAILS_L[i][2])}</td></tr>`).join("")}</table>
<div style="height:7px"></div>
<table class="tb"><colgroup><col style="width:5mm"><col style="width:49%"><col style="width:36%"><col style="width:13%"></colgroup>
<tr><th></th><th>מהות התיקון - עבודות</th><th>פירוט חלפים</th><th>סוג</th></tr>
${r.rows.map((x,i)=>`<tr><td class="num">${i+1}</td><td>${esc(x.work)}</td><td>${esc(x.part)}</td><td style="text-align:center">${esc(x.type)}</td></tr>`).join("")}</table>
<div class="warn">${esc(S.warning)}</div>
<table class="tb"><colgroup><col style="width:17%"><col style="width:33%"><col style="width:17%"><col style="width:33%"></colgroup>
${WORKS_R.map((f,i)=>`<tr><td class="lb">${f[1]}</td><td>${esc(r.w[f[0]])}</td><td class="lb">${WORKS_L[i][1]}</td><td>${esc(r.w[WORKS_L[i][0]])}</td></tr>`).join("")}</table>
${notes.length?`<div class="notes"><b>הערות:</b><ol>${notes.slice(0,half).map(n=>`<li>${esc(n)}</li>`).join("")}</ol><ol start="${half+1}">${notes.slice(half).map(n=>`<li>${esc(n)}</li>`).join("")}</ol></div>`:""}
<div class="sg"><div>תאריך: <span class="ln">${esc(heDate(r.signDate))}</span></div>
<div>${S.appraiserName?esc(S.appraiserName):""}${S.license?` · רישיון ${esc(S.license)}`:""}</div>
<div>חתימת השמאי: <span class="ln">${S.signature?`<img src="${S.signature}" alt="חתימה">`:"&nbsp;"}</span></div></div>
<div class="ct ft">${contact}</div>
</div></body></html>`;
}
function preview(r){
  const html=reportHtml(r);
  const ov=document.createElement("div");ov.className="ov";ov.setAttribute("role","dialog");ov.setAttribute("aria-label","תצוגת הטופס");
  ov.innerHTML=`<div class="bar"><span>תצוגת הטופס</span>${native?`<button class="primary" id="pPrint">שמור PDF / הדפס</button><button id="pSave">שמור HTML</button>`:`<button class="primary" id="pPrint">הדפס / PDF</button>`}<button id="pClose">סגור</button></div><iframe title="טופס"></iframe>`;
  document.body.appendChild(ov);
  const fr=ov.querySelector("iframe");fr.srcdoc=html;
  $("pClose").onclick=()=>ov.remove();
  $("pPrint").onclick=()=>{if(native)Native.printHtml(fileName(r),html);else try{fr.contentWindow.print()}catch{toast("ההדפסה לא זמינה כאן")}};
  if($("pSave"))$("pSave").onclick=async()=>{try{const x=await NB.call("saveFile",fileName(r)+".html","text/html",html);toast("נשמר: "+(x.where||""))}catch{toast("השמירה נכשלה")}};
}

/* ---------- settings ---------- */
let sigStop=null;

  $("app").innerHTML=`
  <section class="card"><h2>פרטי השמאי</h2>
    <div class="grid2">${F("appraiserName","שם השמאי")}${F("license","מספר רישיון שמאי",'inputmode="numeric" dir="ltr"')}</div>
    <p class="note">השם ומספר הרישיון מופיעים ליד החתימה בתחתית הטופס.</p></section>

    <div class="logos">
      <div class="logo"><span class="note">לוגו ימני</span>${S.logoRight?`<img src="${S.logoRight}" alt="לוגו ימני">`:'<span class="note">אין</span>'}<div class="row"><button class="small" data-logo="logoRight">החלף</button><button class="small danger" data-rm="logoRight">הסר</button></div></div>
      <div class="logo"><span class="note">לוגו שמאלי</span>${S.logoLeft?`<img src="${S.logoLeft}" alt="לוגו שמאלי">`:'<span class="note">אין</span>'}<div class="row"><button class="small" data-logo="logoLeft">החלף</button><button class="small danger" data-rm="logoLeft">הסר</button></div></div>
    </div></section>
  <section class="card"><h2>חתימה</h2>
    ${S.signature?`<img src="${S.signature}" alt="החתימה השמורה" style="height:70px;max-width:260px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px">`:""}
    <canvas id="sig" aria-label="שטח לחתימה באצבע"></canvas>
    <div class="row"><button class="small primary" id="sigSave">שמור חתימה</button><button class="small" id="sigClear">נקה</button>${S.signature?`<button class="small danger" id="sigRm">הסר חתימה שמורה</button>`:""}</div>
    <p class="note">חתום באצבע בתוך המסגרת ולחץ "שמור חתימה". החתימה תופיע בכל טופס שתפיק.</p></section>
  <section class="card"><h2>טקסטים בטופס</h2>

    <label for="s_notes">הערות (שורה לכל הערה)<textarea id="s_notes" data-s="notes" rows="8">${esc(S.notes)}</textarea></label></section>
  <section class="card"><div class="row"><button class="danger" id="reset">החזר את פרטי המשרד המקוריים</button></div>
    <p class="note">כל השינויים נשמרים אוטומטית בטלפון.</p></section>`;
  document.querySelectorAll("[data-s]").forEach(e=>e.oninput=()=>{S[e.dataset.s]=e.value;saveS()});
  document.querySelectorAll("[data-logo]").forEach(b=>b.onclick=()=>pickImage(async f=>{S[b.dataset.logo]=await imgToData(f,500);if(saveS())renderSettings()}));
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S[b.dataset.rm]="";saveS();renderSettings()});
  $("reset").onclick=()=>confirmBox("להחזיר את פרטי המשרד, הלוגואים והטקסטים למקור? שם השמאי, הרישיון והחתימה יישמרו.",()=>{
    const keep={appraiserName:S.appraiserName,license:S.license,signature:S.signature};S=Object.assign({},DEFAULT_SETTINGS,keep);saveS();renderSettings()},"החזר");
  setupSig();
  if($("sigRm"))$("sigRm").onclick=()=>{S.signature="";saveS();renderSettings()};
}
function setupSig(){
  const cv=$("sig"),ctx=cv.getContext("2d");let drawing=false,dirty=false;
  const fit=()=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#16233d"};
  fit();
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{drawing=true;dirty=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y)};
  cv.onpointermove=e=>{if(!drawing)return;const[x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
  $("sigClear").onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);dirty=false};
  $("sigSave").onclick=()=>{if(!dirty){toast("חתום קודם בתוך המסגרת");return}S.signature=trimCanvas(cv);if(saveS()){toast("החתימה נשמרה");renderSettings()}};
  sigStop=()=>{cv.onpointermove=null};
}
function trimCanvas(cv){
  const ctx=cv.getContext("2d"),{width:w,height:h}=cv,d=ctx.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<=x0)return"";const p=6;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w,x1+p);y1=Math.min(h,y1+p);
  const o=document.createElement("canvas");const s=Math.min(1,500/(x1-x0));o.width=Math.round((x1-x0)*s);o.height=Math.round((y1-y0)*s);
  o.getContext("2d").drawImage(cv,x0,y0,x1-x0,y1-y0,0,0,o.width,o.height);return o.toDataURL("image/png");
}
function pickImage(cb){const f=$("fileImg");f.value="";f.onchange=()=>{if(f.files[0])cb(f.files[0])};f.click()}
async function imgToData(file,max){
  const url=URL.createObjectURL(file);const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL("image/png");
}
function confirmBox(text,ok,label="מחק"){
  const ov=document.createElement("div");ov.className="ov";ov.style.cssText="align-items:center;justify-content:center;padding:16px";
  ov.innerHTML=`<div class="card" style="max-width:380px"><p style="margin:0">${esc(text)}</p><div class="row"><button class="primary" id="cOk" style="background:var(--bad);border-color:var(--bad)">${esc(label)}</button><button id="cNo">ביטול</button></div></div>`;
  document.body.appendChild(ov);$("cNo").onclick=()=>ov.remove();$("cOk").onclick=()=>{ov.remove();ok()};$("cNo").focus();
}
render();
</script>
