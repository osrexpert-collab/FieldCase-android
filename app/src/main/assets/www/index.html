<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תיק שמאי בשטח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Layout idea: a single-column field tool. A list of cases opens into one case, with sections stacked in work order: vehicle, case, photos, notes, estimate, export. */
:root{
  --ink:#16202e; --paper:#f3f5f7; --card:#ffffff; --line:#d6dce3; --muted:#5d6b7b;
  --accent:#e8a317; --accent-ink:#1a1300; --blue:#1c4f9c; --ok:#1d7a46; --warn:#b4570b; --bad:#b3261e;
  --plate:#f7d117;
  --display:"Secular One","Heebo",system-ui,sans-serif;
  --body:"Heebo",system-ui,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e6ebf1; --paper:#10161e; --card:#18212c; --line:#2b3746; --muted:#97a5b5;
  --accent:#f0b43a; --accent-ink:#1a1300; --blue:#7aa7ec; --ok:#5cc28a; --warn:#f0a25a; --bad:#f08a82; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#e6ebf1; --paper:#10161e; --card:#18212c; --line:#2b3746; --muted:#97a5b5;
  --accent:#f0b43a; --accent-ink:#1a1300; --blue:#7aa7ec; --ok:#5cc28a; --warn:#f0a25a; --bad:#f08a82; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:12px;padding:10px 16px}
header h1{font:22px/1.1 var(--display);margin:0;letter-spacing:.3px}
header .sp{flex:1}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:#7fe0a6}.chip.local{color:#ffc477}
main{max-width:860px;margin:0 auto;padding:16px;display:grid;gap:16px}
h2{font:19px/1.2 var(--display);margin:0;text-wrap:balance}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%}
textarea{min-height:96px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:500 15px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.muted{color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px}
.hide{display:none!important}
/* Israeli plate */
.plate{direction:ltr;display:inline-flex;align-items:stretch;border:2px solid #111;border-radius:5px;background:var(--plate);color:#111;font:700 18px/1 var(--body);letter-spacing:1px;overflow:hidden;min-width:120px}
.plate i{background:#1c4f9c;color:#fff;font:700 9px/1 var(--body);font-style:normal;writing-mode:vertical-rl;transform:rotate(180deg);padding:2px 3px;display:flex;align-items:center;justify-content:center}
.plate b{padding:6px 10px;flex:1;text-align:center;font-variant-numeric:tabular-nums}
/* case list */
.list{display:grid;gap:10px}
.case{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:start;width:100%;padding:12px 14px;border-radius:10px}
.case .t{font-weight:700}
.case .s{font-size:13px;color:var(--muted)}
.case .amt{font-variant-numeric:tabular-nums;font-weight:700;text-align:left}
.pill{font-size:12px;border-radius:99px;padding:2px 9px;font-weight:500;display:inline-block}
.st-draft{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.st-checked{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.st-sent{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.empty{border:2px dashed var(--line);border-radius:10px;padding:20px;display:grid;gap:8px}
/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;background:var(--paper)}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#0003}
.ph .b{padding:8px;display:grid;gap:6px}
.ph select,.ph textarea{font-size:13px;padding:6px}
.ph textarea{min-height:56px}
.ph .acts{display:flex;gap:6px;flex-wrap:wrap}
.ph .acts button{font-size:12px;padding:5px 8px}
.upl{font-size:12px;color:var(--warn)}
/* estimate */
.est{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.est th{font-size:13px;color:var(--muted);text-align:start;font-weight:500;padding:4px}
.est td{padding:4px;vertical-align:top}
.est td.n{width:120px}.est td.k{width:110px}.est td.x{width:40px}
.est input,.est select{padding:7px}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 16px;max-width:320px;margin-inline-start:auto;font-variant-numeric:tabular-nums}
.tot .g{font-weight:700;font-size:18px;border-top:2px solid var(--ink);padding-top:4px}
.wrapx{overflow-x:auto}
.back{font-size:14px}
.sticky-actions{display:flex;gap:10px;flex-wrap:wrap}
/* overlay */
.ov{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.ov .box{background:var(--card);color:var(--ink);border-radius:12px;max-width:820px;width:100%;padding:16px;display:grid;gap:12px}
.ov .rep{background:#fff;color:#111;border-radius:8px;padding:8px;max-height:65vh;overflow:auto}
.toast{position:fixed;bottom:16px;inset-inline:16px;margin:auto;max-width:480px;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;z-index:30;font-size:14px}
@media (max-width:520px){.case{grid-template-columns:1fr;gap:6px}.case .amt{text-align:start}.est td.k{width:auto}}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s}}
</style>
</head>
<body>
<header>
  <h1>תיק שמאי בשטח</h1>
  <span class="sp"></span>
  <span id="sync" class="chip local">מתחבר…</span>
</header>
<main id="app"></main>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<input id="fileCam" type="file" accept="image/*" capture="environment" multiple class="hide">
<input id="fileGal" type="file" accept="image/*" multiple class="hide">
<input id="filePlate" type="file" accept="image/*" capture="environment" class="hide">

<script>
"use strict";
/* ---------- constants ---------- */
const VAT = 0.18; // מע"מ בישראל מינואר 2025
const AREAS = ["חזית","אחור","צד ימין","צד שמאל","גג","פנים הרכב","מכסה מנוע","לוחית רישוי","מד קילומטרים","מספר שלדה","מסמכים","אחר"];
const KINDS = ["חלפים","עבודה","צבע","אחר"];
const STATUS = {draft:"טיוטה",checked:"נבדק",sent:"נשלח"};
const fmt = new Intl.NumberFormat("he-IL",{style:"currency",currency:"ILS",minimumFractionDigits:0,maximumFractionDigits:0});
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const $ = id => document.getElementById(id);
const GOV_RES = "053cea08-09bc-40ec-8f7a-156f0677aff3"; // data.gov.il: כלי רכב פרטיים ומסחריים פעילים
const fmtDate = s => {const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(s||"");};

/* ---------- appraiser profile (global, on this device) ---------- */
const PKEY="fieldcase.profile";
const PROFILE_FIELDS=[["appraiserName","שם השמאי"],["appraiserLicense","מספר רישיון שמאי","dir=\"ltr\" inputmode=\"numeric\""],["officeName","שם משרד השמאות"],["officeLicense","מספר רישיון / אישור של המשרד","dir=\"ltr\""]];
let profile=(()=>{try{return JSON.parse(localStorage.getItem(PKEY)||"{}")||{}}catch{return {}}})();
function saveProfile(){try{localStorage.setItem(PKEY,JSON.stringify(profile));return true}catch{return false}}

/* ---------- state ---------- */
let cases = {};          // id -> case
let current = null;      // open case id
const blobs = new Map(); // photo id -> compressed Blob (this visit)
let cap = {db:null,user:null,assets:null,sample:null,dict:null,dl:null,images:false};
let mode = "memory";     // cloud | local | memory
let uidUser = null;

function toast(msg,ms=3200){const t=$("toast");t.textContent=msg;t.classList.remove("hide");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add("hide"),ms);}

function newCase(){
  return {id:uid(),status:"draft",createdAt:Date.now(),updatedAt:Date.now(),
    plate:"",make:"",model:"",year:"",km:"",color:"",vin:"",
    owner:"",phone:"",insurer:"",claimNo:"",eventDate:"",inspDate:today(),inspPlace:"",
    photos:[],notes:"",dictation:"",costs:[],reg:null};
}
const totals = c => {const sub=(c.costs||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);return {sub,vat:sub*VAT,total:sub*(1+VAT)};};
function fmtPlate(p){const d=String(p||"").replace(/\D/g,"");if(d.length===7)return d.slice(0,2)+"-"+d.slice(2,5)+"-"+d.slice(5);if(d.length===8)return d.slice(0,3)+"-"+d.slice(3,5)+"-"+d.slice(5);return p||"";}
const plateHtml = p => `<span class="plate" aria-label="לוחית ${esc(fmtPlate(p))}"><i>IL</i><b>${esc(fmtPlate(p)||"—")}</b></span>`;

/* ---------- storage ---------- */
const LSKEY="fieldcase.v1";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LSKEY)||"{}")}catch{return {}}}
function lsSave(){try{localStorage.setItem(LSKEY,JSON.stringify(cases,(k,v)=>k==="src"&&typeof v==="string"&&v.startsWith("blob:")?undefined:k==="uploading"?undefined:v));return true}catch{return false}}
const writing=new Map(); // id -> {busy, pending}
function persist(c){
  c.updatedAt=Date.now(); cases[c.id]=c;
  if(mode==="cloud"){
    const w=writing.get(c.id)||{busy:false,pending:false}; writing.set(c.id,w);
    clearTimeout(w.t); w.t=setTimeout(()=>flush(c.id),600);
  } else if(mode==="local"){ if(!lsSave()) toast("האחסון במכשיר מלא. ייצא גיבוי ומחק תיקים ישנים."); }
}
async function flush(id){
  const w=writing.get(id); if(!w) return;
  if(w.busy){w.pending=true;return}
  w.busy=true;
  try{
    const c=cases[id]; if(c){const body=JSON.parse(JSON.stringify(c)); body.photos=body.photos.map(p=>{const q={...p};if(!q.assetId)delete q.src;return q});
      await cap.db.collection("data/users/"+uidUser).doc("c_"+id).set(body);}
  }catch(e){
    if(e&&e.code==="quota_exceeded") toast("נגמר המקום בשמירה בענן. מחק תיקים ישנים.");
    else if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));w.pending=true;}
    else toast("השמירה נכשלה. השינויים נשמרו רק במסך הזה.");
  }finally{w.busy=false;if(w.pending){w.pending=false;flush(id)}}
}
async function removeCase(id){
  delete cases[id];
  if(mode==="cloud"){try{await cap.db.collection("data/users/"+uidUser).doc("c_"+id).delete()}catch{toast("המחיקה בענן נכשלה")}}
  else if(mode==="local") lsSave();
}

/* ---------- capabilities ---------- */
async function boot(){
  render();
  if(window.Native){nativeBoot();return}
  if(!window.claude||!claude.use){fallbackLocal();return}
  const [db,user,assets,sample,dict,dl]=await Promise.all(["db","user","assets","sample","dictation","downloads"].map(n=>claude.use(n).catch(()=>null)));
  Object.assign(cap,{db,user,assets,sample,dict,dl});
  if(sample){try{const l=await sample.limits();cap.images=!!l.images}catch{cap.images=false}}
  if(dict) setupDictation();
  if(db&&user){
    try{uidUser=await user.id()}catch{uidUser=null}
    if(uidUser){startCloud();return}
  }
  fallbackLocal();
}
function fallbackLocal(){
  try{localStorage.setItem("fc.t","1");localStorage.removeItem("fc.t");mode="local";cases=lsLoad();setSync("שמור במכשיר זה בלבד","local")}
  catch{mode="memory";setSync("לא נשמר — ייצא גיבוי","local")}
  render();
}
function setSync(t,k){const s=$("sync");s.textContent=t;s.className="chip "+k;}
function startCloud(){
  mode="cloud"; setSync("טוען…","local");
  const timer=setTimeout(()=>setSync("אין חיבור לשמירה — נסה מאוחר יותר","local"),10000);
  cap.db.collection("data/users/"+uidUser).onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);setSync("נשמר בענן","ok")}
    const next={};
    for(const d of snap.docs){if(!d.id.startsWith("c_"))continue;const v=JSON.parse(JSON.stringify(d.data()));
      const mine=cases[v.id]; // keep photos that exist only in this visit (no asset)
      if(mine){const extra=mine.photos.filter(p=>!p.assetId&&!v.photos.some(q=>q.id===p.id));v.photos=v.photos.concat(extra);
        for(const p of v.photos){const m=mine.photos.find(q=>q.id===p.id);if(m&&m.src&&!p.src)p.src=m.src}}
      next[v.id]=v;}
    // keep unsaved local edits of the open case
    if(current&&cases[current]) next[current]=cases[current];
    cases=next;
    if(!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#app")&&current)) render();
  },e=>{clearTimeout(timer);setSync("השמירה בענן לא זמינה","local");});
}

/* ---------- routing ---------- */
function go(id){current=id;location.hash=id?("c-"+id):"";render();window.scrollTo(0,0)}
addEventListener("hashchange",()=>{const h=location.hash.slice(1);const id=h.startsWith("c-")?h.slice(2):null;if(id!==current){current=id&&cases[id]?id:null;render()}});

/* ---------- render ---------- */
function render(){
  const app=$("app");
  if(current&&cases[current]){app.innerHTML=caseView(cases[current]);bindCase(cases[current]);return}
  current=null;
  const q=(render.q||"").trim();
  const list=Object.values(cases).sort((a,b)=>b.updatedAt-a.updatedAt)
    .filter(c=>!q||[c.plate,c.owner,c.make,c.model,c.claimNo,c.insurer].join(" ").replace(/-/g,"").includes(q.replace(/-/g,"")));
  app.innerHTML=`
  <section class="card">
    <div class="row"><h2 style="flex:1">התיקים שלי</h2><button class="primary" id="new">+ תיק חדש</button></div>
    <input id="q" type="search" placeholder="חיפוש לפי מספר רכב, בעלים, יצרן או מספר תביעה" value="${esc(q)}" aria-label="חיפוש תיקים">
    <div class="list">${list.length?list.map(c=>{const t=totals(c);return `
      <button class="case" data-open="${esc(c.id)}">
        ${plateHtml(c.plate)}
        <span><span class="t">${esc([c.make,c.model,c.year].filter(Boolean).join(" ")||"רכב ללא פרטים")}</span>
          <span class="s">${esc(c.owner||"בעלים לא הוזן")} · ${c.photos.length} תמונות · בדיקה ${esc(c.inspDate||"")}</span></span>
        <span class="amt">${fmt.format(t.total)}<br><span class="pill st-${esc(c.status)}">${STATUS[c.status]||""}</span></span>
      </button>`}).join(""):(Object.keys(cases).length?`<p class="muted">לא נמצאו תיקים שמתאימים לחיפוש.</p>`:`
      <div class="empty"><strong>עוד אין תיקים.</strong>
      <span class="muted">פתח תיק כשאתה מגיע לרכב: צלם את הלוחית והנזקים, הכתב הערות ואומדן, ובסוף הפק דוח שטח עם התמונות.</span></div>`)}
    </div>
  </section>
  <section class="card">
    <div class="row"><h2 style="flex:1">השמאי והמשרד</h2><button id="prof">${profileSummary()?"עריכה":"הוסף פרטים"}</button></div>
    <p class="${profileSummary()?"":"muted"}" style="margin:0">${esc(profileSummary())||"עוד לא הוזנו. שם השמאי, מספר הרישיון ופרטי המשרד יופיעו בכל דוח שטח."}</p>
  </section>
  <p class="note">${mode==="cloud"?"התיקים נשמרים בחשבון שלך ונגישים מכל מכשיר. רק אתה רואה אותם.":mode==="local"?(window.Native?"התיקים והתמונות נשמרים בטלפון הזה בלבד. כדאי לשמור גיבוי של תיקים חשובים.":"התיקים נשמרים בדפדפן הזה בלבד. כדאי לייצא גיבוי מדי פעם."):"אין כאן אחסון. ייצא גיבוי לפני שאתה סוגר את הדף."}</p>`;
  $("new").onclick=()=>{const c=newCase();persist(c);go(c.id)};
  $("prof").onclick=profileDialog;
  const qi=$("q");qi.oninput=()=>{render.q=qi.value;const p=qi.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p)};
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go(b.dataset.open));
}

const F=(c,k,l,t="text",extra="")=>`<label for="f_${k}">${l}<input id="f_${k}" data-k="${k}" type="${t}" value="${esc(c[k])}" ${extra}></label>`;
function caseView(c){
  const t=totals(c), ai=!!cap.sample, img=ai&&cap.images, mic=!!cap.dict;
  return `
  <div class="row"><button class="ghost back" id="back">→ כל התיקים</button><span class="sp" style="flex:1"></span>
    <label for="f_status" style="display:flex;gap:6px;align-items:center">סטטוס
    <select id="f_status" data-k="status" style="width:auto">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${c.status===k?"selected":""}>${v}</option>`).join("")}</select></label></div>

  <section class="card">
    <div class="row"><h2 style="flex:1">פרטי הרכב</h2><span id="platePrev">${plateHtml(c.plate)}</span></div>
    <div class="row">
      ${(img||cap.plate)?`<button id="plateCam">צלם לוחית וזהה מספר</button>`:""}
      <button id="regBtn">משוך נתוני רכב לפי המספר</button>
      <span id="plateMsg" class="note">${cap.plate?"המספר מזוהה בטלפון עצמו. כדאי לבדוק אותו.":img?"Claude יקרא את המספר מהתמונה. כדאי לבדוק אותו.":""}</span>
    </div>
    <div class="grid2">
      ${F(c,"plate","מספר רישוי","text",'inputmode="numeric" dir="ltr"')}
      ${F(c,"make","יצרן")}${F(c,"model","דגם")}
      ${F(c,"year","שנת ייצור","text",'inputmode="numeric"')}
      ${F(c,"km","קילומטראז׳","text",'inputmode="numeric"')}
      ${F(c,"color","צבע")}${F(c,"vin","מספר שלדה","text",'dir="ltr"')}
    </div>
    ${regHtml(c)}
  </section>

  <section class="card">
    <h2>פרטי התיק</h2>
    <div class="grid2">
      ${F(c,"owner","שם הבעלים")}${F(c,"phone","טלפון","tel",'dir="ltr"')}
      ${F(c,"insurer","חברת ביטוח")}${F(c,"claimNo","מספר תביעה",'text','dir="ltr"')}
      ${F(c,"eventDate","תאריך האירוע","date")}${F(c,"inspDate","תאריך הבדיקה","date")}
      ${F(c,"inspPlace","מקום הבדיקה (מוסך / כתובת)")}
      ${cap.gps?`<div style="display:grid;align-content:end;gap:4px"><button id="gpsBtn">מיקום נוכחי</button><span class="note" id="gpsMsg">${c.gps?esc(c.gps.lat.toFixed(5)+", "+c.gps.lng.toFixed(5)):""}</span></div>`:""}
    </div>
  </section>

  <section class="card">

  $("del").onclick=()=>confirmBox(`למחוק את התיק ${fmtPlate(c.plate)||""}? אי אפשר לבטל.`,"מחק",async()=>{
    if(cap.assets) for(const p of c.photos) if(p.assetId) try{await cap.assets.delete(p.assetId)}catch{}
    await removeCase(c.id);go(null)});
}

/* ---------- vehicle registry (data.gov.il, משרד התחבורה) ---------- */
function regHtml(c){
  const r=c.reg; if(!r)return `<p class="note" id="regMsg"></p>`;
  const parts=[["סוג דלק",r.fuel],["רמת גימור",r.trim],["בעלות",r.ownership],["טסט אחרון",fmtDate(r.lastTest)],["רישיון בתוקף עד",fmtDate(r.validUntil)],["עלייה לכביש",r.onRoad]].filter(x=>x[1]);
  return `<p class="note" id="regMsg"></p><p class="note" style="margin-top:0">נתוני משרד התחבורה למספר ${esc(fmtPlate(r.plate))}, נמשכו ${new Date(r.fetchedAt).toLocaleDateString("he-IL")}${parts.length?": "+parts.map(x=>esc(x[0]+" "+x[1])).join(" · "):""}</p>`;
}
async function fetchVehicle(d){
  if(window.Native&&Native.vehicleLookup){
    const body=await NB.call("vehicleLookup",d);
    const j=JSON.parse(body); if(!j||!j.success)throw {code:"bad_response"};
    return (j.result.records||[])[0]||null;
  }
  const url="https://data.gov.il/api/3/action/datastore_search?resource_id="+GOV_RES+"&limit=1&filters="+encodeURIComponent(JSON.stringify({mispar_rechev:d}));
  const res=await fetch(url,{headers:{Accept:"application/json"}}); if(!res.ok)throw {code:"http"};
  const j=await res.json(); if(!j||!j.success)throw {code:"bad_response"};
  return (j.result.records||[])[0]||null;
}
async function lookupVehicle(c,manual){
  const d=String(c.plate||"").replace(/\D/g,""), msg=()=>$("regMsg"), btn=$("regBtn");
  if(d.length!==7&&d.length!==8){if(manual&&msg())msg().textContent="הקלד מספר רישוי מלא, 7 או 8 ספרות.";return}
  if(lookupVehicle.busy)return; lookupVehicle.busy=true;
  if(btn){btn.disabled=true;btn.textContent="מחפש…"}
  if(msg())msg().textContent="מחפש במאגר משרד התחבורה…";
  let note="";
  try{
    const rec=await fetchVehicle(d);
    if(!rec) note="המספר לא נמצא במאגר של משרד התחבורה (רכבים פרטיים ומסחריים פעילים). אפשר למלא את הפרטים ידנית.";
    else{
      const set=(k,v)=>{v=String(v??"").trim();if(v)c[k]=v};
      if(String(c.plate).replace(/\D/g,"")===d){
        set("make",rec.tozeret_nm); set("model",rec.kinuy_mishari||rec.degem_nm); set("year",rec.shnat_yitzur);
        set("color",rec.tzeva_rechev); set("vin",rec.misgeret);
        c.plate=fmtPlate(d);
        c.reg={plate:d,fetchedAt:Date.now(),fuel:rec.sug_delek_nm||"",trim:rec.ramat_gimur||"",modelCode:rec.degem_nm||"",
          ownership:rec.baalut||"",lastTest:rec.mivchan_acharon_dt||"",validUntil:rec.tokef_dt||"",onRoad:rec.moed_aliya_lakvish||""};
        persist(c); note="הנתונים נמשכו ממאגר משרד התחבורה. בדוק שהם תואמים לרכב.";
      }
    }
  }catch(e){note="לא הצלחתי להתחבר למאגר משרד התחבורה. בדוק חיבור לאינטרנט ונסה שוב."}
  finally{lookupVehicle.busy=false}
  if(current===c.id){render();if(msg())msg().textContent=note}
}

/* ---------- photos ---------- */
async function compress(file,max=1600,q=.82){
  let bmp; try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}catch{
    bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const w=bmp.width,h=bmp.height,s=Math.min(1,max/Math.max(w,h));
  const cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);
  cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(r,"image/jpeg",q));
}
const toDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function addPhotos(files,area){
  const c=cases[current]; if(!c||!files.length)return;
  for(const f of files){
    let blob; try{blob=await compress(f)}catch{toast("לא הצלחתי לפתוח את התמונה");continue}
    const p={id:uid(),area:area||guessArea(c),caption:"",ts:Date.now(),src:URL.createObjectURL(blob),uploading:!!cap.assets};
    stampGps(c,p);
    blobs.set(p.id,blob); c.photos.push(p); render();
    if(cap.assets){
      try{const a=await cap.assets.upload(blob);p.assetId=a.id;p.src=a.url||("/_blob/"+a.id)}
      catch{toast("העלאת התמונה נכשלה. היא נשמרת רק במסך הזה.")}
      p.uploading=false;
    }
    persist(c);
  }
  render();
}
function guessArea(c){const used=new Set(c.photos.map(p=>p.area));return ["חזית","אחור","צד ימין","צד שמאל","לוחית רישוי","מד קילומטרים"].find(a=>!used.has(a))||"אחר";}
$("fileCam").onchange=e=>{addPhotos([...e.target.files]);e.target.value=""};
$("fileGal").onchange=e=>{addPhotos([...e.target.files]);e.target.value=""};

function setupDictation(){

    if(state==="listening"){if(micBtn){micBtn.classList.add("rec");micBtn.textContent="עצור הכתבה"}}
    else{document.querySelectorAll("[data-mic]").forEach(b=>{b.classList.remove("rec");b.textContent="הכתב"});micTarget=null}
  });

function toggleMic(target,btn){
  const d=cap.dict;if(!d)return;
  if(micTarget){const was=micTarget;d.stop().catch(()=>{});if(was===target)return}
  const el=$("f_"+target);micTarget=target;micBtn=btn;micBase=el.value?(el.value.replace(/\s*$/," ")):"";
  d.start().catch(e=>{micTarget=null;btn.classList.remove("rec");btn.textContent="הכתב";
    if(e&&e.code==="not_granted"){document.querySelectorAll("[data-mic]").forEach(b=>b.remove());cap.dict=null;toast("ההכתבה לא אושרה. אפשר להקליד.")}});

async function parseEstimate(c){
  if(!cap.sample&&cap.localParse) return localParseEstimate(c);
  const txt=(c.dictation||"").trim(), msg=$("estMsg");
  if(!txt){msg.textContent="אין טקסט להמרה.";return}
  const b=$("parseEst");b.disabled=true;msg.textContent="ממיר…";
  try{
    const rows=await cap.sample.json(
`המר את האומדן שהכתיב שמאי רכב לשורות. כל שורה: פריט אחד.
kind הוא אחד מ: "חלפים", "עבודה", "צבע", "אחר". amount הוא מספר בשקלים לפני מע"מ (המר מילים למספרים; "אלף שמונה מאות" = 1800). אם נאמר מחיר לשעה ומספר שעות, הכפל. אם לא נאמר סכום, amount הוא 0.
ענה רק ב-JSON: מערך של {"desc":"פגוש קדמי — החלפה","kind":"חלפים","amount":1800}.

הטקסט:
${txt.slice(0,6000)}`,{modelTier:"default"});
    if(!Array.isArray(rows)||!rows.length)throw {code:"invalid_json"};
    const add=rows.map(r=>({desc:String(r.desc||"").slice(0,200),kind:KINDS.includes(r.kind)?r.kind:"אחר",amount:String(Math.max(0,Number(r.amount)||0))}));
    c.costs=(c.costs||[]).filter(r=>r.desc||Number(r.amount)).concat(add);
    c.dictation="";persist(c);render();toast(`נוספו ${add.length} שורות. בדוק את הסכומים.`);

const dictShim={_p:null,_f:null,_s:null,_start:null,
  onPartial(f){this._p=f},onFinal(f){this._f=f},onState(f){this._s=f},
  start(){return new Promise((res,rej)=>{this._start={res,rej};Native.startDictation()})},
  stop(){try{Native.stopDictation()}catch{}return Promise.resolve()}};
window.__dict=(type,text)=>{const d=dictShim;
  if(type==="partial")d._p&&d._p({text});
  else if(type==="final")d._f&&d._f({text});
  else if(type==="listening"){d._s&&d._s({state:"listening"});if(d._start){d._start.res();d._start=null}}
  else if(type==="idle"){d._s&&d._s({state:"idle",reason:text});if(d._start){d._start.res();d._start=null}

  else if(type==="error"){d._s&&d._s({state:"idle",reason:text});if(d._start){d._start.rej({code:text==="not_granted"?"not_granted":"unavailable"});d._start=null}
    if(text==="unavailable")toast("אין בטלפון שירות זיהוי דיבור. התקן או הפעל את Google.");}

let lastLoc=null, locPending=null;
function getLoc(){if(locPending)return locPending;
  locPending=NB.call("getLocation").then(l=>{lastLoc=l;return l}).finally(()=>{locPending=null});return locPending}
function stampGps(c,p){if(!cap.gps)return;
  const fresh=lastLoc&&Date.now()-lastLoc.ts<5*60*1000;
  if(fresh){p.gps={lat:lastLoc.lat,lng:lastLoc.lng,acc:lastLoc.acc};return}
  getLoc().then(l=>{p.gps={lat:l.lat,lng:l.lng,acc:l.acc};persist(c)}).catch(()=>{});}

/* המרת אומדן מוכתב לשורות, בלי אינטרנט */
const HEB_NUM={"אחד":1,"אחת":1,"שתיים":2,"שניים":2,"שתי":2,"שלוש":3,"שלושה":3,"שלושת":3,"ארבע":4,"ארבעה":4,"ארבעת":4,"חמש":5,"חמישה":5,"חמשת":5,
  "שש":6,"שישה":6,"ששת":6,"שבע":7,"שבעה":7,"שבעת":7,"שמונה":8,"שמונת":8,"תשע":9,"תשעה":9,"תשעת":9,"עשר":10,"עשרה":10,"עשרת":10,
  "עשרים":20,"שלושים":30,"ארבעים":40,"חמישים":50,"שישים":60,"שבעים":70,"שמונים":80,"תשעים":90,"מאה":100,"מאתיים":200,"אלפיים":2000,"חצי":0.5};
const NUM_JOIN=new Set(["מאות","אלף","אלפים","עשר","עשרה"]);
function numToken(w){
  if(/^\d[\d,.]*$/.test(w))return {v:parseFloat(w.replace(/,/g,"")),k:"n"};
  let x=w.replace(/^ב-/,"ב"); if(x.startsWith("ב")&&x.length>2&&(HEB_NUM[x.slice(1)]!=null||/^\d/.test(x.slice(1))||NUM_JOIN.has(x.slice(1))))x=x.slice(1);
  if(x.startsWith("ו")&&x.length>2&&(HEB_NUM[x.slice(1)]!=null||NUM_JOIN.has(x.slice(1))))x=x.slice(1);
  if(/^\d[\d,.]*$/.test(x))return {v:parseFloat(x.replace(/,/g,"")),k:"n"};
  if(x==="מאות")return {k:"h"}; if(x==="אלף"||x==="אלפים")return {k:"t"}; if(x==="אלפיים")return {k:"t2"};
  if(HEB_NUM[x]!=null)return {v:HEB_NUM[x],k:"n"};
  return null;
}
function parseNumbers(words){ // returns [{start,end,value}]
  const out=[];let i=0;
  while(i<words.length){
    let t=numToken(words[i]); if(!t){i++;continue}
    let total=0,cur=0,last=0,start=i,any=false;
    while(i<words.length&&(t=numToken(words[i]))){
      any=true;
      if(t.k==="n"){ if((words[i]==="עשר"||words[i]==="עשרה")&&cur>0&&cur<10){cur+=10;last=0} else {cur+=t.v;last=t.v} }
      else if(t.k==="h"){ if(last>0&&last<10){cur+=last*99}else cur+=100; last=0 }
      else if(t.k==="t"){total+=(cur||1)*1000;cur=0;last=0}
      else if(t.k==="t2"){total+=2000;last=0}
      i++;
    }
    if(any)out.push({start,end:i,value:total+cur});
  }
  return out;
}
function kindOf(s){if(/צבע|ליטוש|פוליש/.test(s))return "צבע";if(/עבודה|שעות|שעה|פירוק|הרכבה|יישור|כיוון|פחחות/.test(s))return "עבודה";if(/חלק|החלפה|חדש|מקורי|תחליפי|משומש|פנס|פגוש|מראה|דלת|כנף|מכסה|שמשה|חיישן|גריל|צמיג|ג׳נט|גנט/.test(s))return "חלפים";return "אחר"}
const FILLER=/^(שקל|שקלים|ש"ח|ש״ח|שח|₪|כולל|לפני|מע"מ|מע״מ|לשעה|כל|אחת|של)$/;
const HOURS=/^(שעות|שעה|ש"ע|ש״ע)$/;
function parseEstimateText(txt){
  const toks=txt.replace(/,(?!\d)|(?<!\d),|[\n;]|\.(?!\d)/g," | ").replace(/₪/g," ").split(/\s+/).filter(Boolean);
  const items=[];let desc=[],i=0;
  const span=k=>{const r=parseNumbers(toks.slice(k).filter((w,ix)=>true));const f=r[0];return f&&f.start===0?{value:f.value,end:k+f.end}:null};
  const push=(d,amount,extra)=>{const text=d.join(" ").trim();if(!text&&!amount)return;
    const full=(text||"עבודה")+(extra?" — "+extra:"");items.push({desc:full,kind:kindOf(full),amount:String(Math.round(amount||0))})};
  while(i<toks.length){
    const t=toks[i];
    if(t==="|"){if(desc.length){push(desc,0);desc=[]}i++;continue}
    if(FILLER.test(t)&&!numToken(t)){i++;continue}
    const s=numToken(t)?span(i):null;
    if(!s){desc.push(t);i++;continue}
    let j=s.end,amount=s.value,extra="";
    if(j<toks.length&&HOURS.test(toks[j])){
      const hours=s.value;j++;while(j<toks.length&&FILLER.test(toks[j])&&!numToken(toks[j]))j++;
      const r=j<toks.length&&numToken(toks[j])?span(j):null;
      extra=`${hours} שעות`;
      if(r){amount=hours*r.value;extra+=` × ${r.value} ₪`;j=r.end}else amount=0;
    }
    push(desc,amount,extra);desc=[];i=j;
  }
  if(desc.length)push(desc,0);
  return items;
}
function localParseEstimate(c){
  const txt=(c.dictation||"").trim(),msg=$("estMsg");
  if(!txt){msg.textContent="אין טקסט להמרה.";return}
  const rows=parseEstimateText(txt);
  if(!rows.length){msg.textContent="לא זוהו שורות. אמור פריט ואחריו סכום.";return}
  c.costs=(c.costs||[]).filter(r=>r.desc||Number(r.amount)).concat(rows);
  c.dictation="";persist(c);render();toast(`נוספו ${rows.length} שורות. בדוק את הסכומים.`);
}
